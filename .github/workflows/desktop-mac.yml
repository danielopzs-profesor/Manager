name: Desktop Mac
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar que la versión pertenece a desktop-app
        run: |
          git fetch origin desktop-app
          git merge-base --is-ancestor HEAD origin/desktop-app
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME}" = "desktop-v$(node -p "require('./package.json').version")"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generar app Intel para macOS
        run: npm run desktop:dist
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: Arte-Mac-Intel
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.blockmap
      - name: Preparar versión en borrador (solo etiquetas desktop)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Arte Desktop $GITHUB_REF_NAME" --notes "Versión de escritorio para Mac Intel. Revisar firma y notarización antes de publicar." release/*.dmg release/*.zip release/latest-mac.yml release/*.blockmap
